[project]
name = "nemo-relay-plugin-release-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.25.1", "tomli-w==1.2.0"]

[dependency-groups]
test = ["pytest==8.4.2", "ruff==0.14.0", "pyyaml==6.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
