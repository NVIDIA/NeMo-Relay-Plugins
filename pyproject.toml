[project]
name = "nemo-relay-plugin-release-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0", "tomli-w==1.2.0"]

[dependency-groups]
test = [
    "pytest==9.1.1",
    "ruff==0.16.7",
    "pyyaml==6.0.3",
    "pre-commit==4.6.2",
    "pre-commit-hooks==6.0.0",
]

[tool.uv]
prerelease = "disallow"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
