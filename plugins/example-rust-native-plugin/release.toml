# SPDX-License-Identifier: Apache-2.0
schema_version = 1
name = "example-rust-native-plugin"
version = "0.1.0"
type = "native"

[metadata]
description = "example rust native plugin"
license = "Apache-2.0"
authors = ["NVIDIA Corporation"]
repository = "https://github.com/NVIDIA/NeMo-Relay-Plugins"
documentation = "https://github.com/NVIDIA/NeMo-Relay-Plugins/tree/main/plugins/example-rust-native-plugin"

[source]
location = "in-tree"
path = "."

[toolchains]
python = "3.11"
rust = "1.96.1"

[commands.build]
argv = ["${PYTHON}", "${PLUGIN_DIR}/tasks.py", "build"]
cwd = "source"

[commands.test]
argv = ["${PYTHON}", "${PLUGIN_DIR}/tasks.py", "test"]
cwd = "source"

[commands.package]
argv = ["${PYTHON}", "${PLUGIN_DIR}/tasks.py", "package"]
cwd = "source"

[commands.smoke]
argv = ["${PYTHON}", "${PLUGIN_DIR}/smoke_test.py"]
cwd = "source"

[artifacts]
bundle = "bundle"
manifest = "relay-plugin.toml"

# Upstream main requires the unpublished Relay 0.9 SDK.
[relay]
sha = "65eb82bf3d788986512246abf7f8ab7a520f28d9"
