# Integration tests load the plugin into an in-process Relay host. Keep that host
# from reading the machine's user or system plugins.toml, which may enable
# unrelated plugins. Only the test-only `__skip-implicit-config` feature reads it.
[env]
NEMO_RELAY_TEST_SKIP_IMPLICIT_CONFIG = "1"
