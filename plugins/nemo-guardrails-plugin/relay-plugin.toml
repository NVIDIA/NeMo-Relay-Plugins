manifest_version = 1

[plugin]
id = "nemoguardrails.nemo_relay"
kind = "worker"

[compat]
relay = "=0.9.0-rc.2"
worker_protocol = "grpc-v1"

[defaults]
enabled = false

[capabilities]
items = ["plugin_worker", "config_schema"]

[config_schema]
path = "config.schema.json"

[source]
manifest_root = "."
artifact = "nemoguardrails_nemo_relay/worker.py"

[integrity]
sha256 = "sha256:09be01479d0d383839cc2426c8a47bf3fa08703fd2a66b88ce4abe37f8baa59b"

[load]
runtime = "python"
entrypoint = "nemoguardrails_nemo_relay.worker:main"
