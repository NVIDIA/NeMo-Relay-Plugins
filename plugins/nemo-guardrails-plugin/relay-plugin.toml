manifest_version = 1

[plugin]
id = "nemoguardrails.nemo_relay"
kind = "worker"

[compat]
relay = ">=0.9.0,<1.0"
worker_protocol = "grpc-v1"

[defaults]
enabled = false

[capabilities]
items = ["plugin_worker", "config_schema"]

[config_schema]
path = "config.schema.json"

[source]
manifest_root = "."
artifact = "nemoguardrails_nemo_relay/worker.py"

[integrity]
sha256 = "sha256:ff5bba395b6d3a5b32cacc5f1797b4937a4baa1a87d9ecd6fca6dda952a740df"

[load]
runtime = "python"
entrypoint = "nemoguardrails_nemo_relay.worker:main"
