[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nemoguardrails-nemo-relay"
version = "0.1.0"
description = "NeMo Guardrails text and structural function-tool worker for NeMo Relay"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE*"]
dependencies = [
  # check_backend.py uses the async client for the opt-in remote /v1/checks lane.
  "httpx==0.28.1",
  "nemo-relay==0.9.0",
  "nemo-relay-plugin==0.9.0",
  "nemoguardrails==0.24.1",
  # Guardrails currently permits newer ONNX Runtime releases whose macOS
  # wheels require macOS 14. Keep the plugin on the oldest tested release
  # that supports every platform declared in release.toml.
  "onnxruntime==1.23.2",
]

[project.optional-dependencies]
# These profiles are intentionally excluded from the base Relay bundle. They
# let custom distributions opt into one Guardrails integration at a time
# without adding large or platform-specific packages to every installation.
cleanlab = ["cleanlab-studio==2.5.21"]
gcp-moderation = ["nemoguardrails[gcp]==0.24.1"]
guardrails-ai = [
  # Guardrails AI installs its validators as separate distributions. Keep one
  # small, deterministic validator in this contract-tested profile instead of
  # advertising an empty client runtime as validator support.
  "guardrails-ai==0.11.0",
  "guardrails-ai-regex-match==0.1.0",
]
presidio = ["nemoguardrails[sdd]==0.24.1"]
yara = ["nemoguardrails[jailbreak]==0.24.1"]
hf-classifier = [
  # This is dependency assistance for Guardrails' local backend, not a
  # self-contained runtime. Keep Torch operator-selected: PyPI's Linux package
  # pulls a CUDA stack into the cross-platform lock even for CPU deployments.
  "transformers>=4.35,<5",
]
langchain-anthropic = [
  # Stay on the mutually compatible pre-1.0 provider family covered by the
  # Guardrails contract tests instead of resolving unrelated future APIs.
  "langchain>=0.3.27,<1",
  "langchain-anthropic>=0.3.22,<1",
  # 0.3.22 is the newest 0.3 community release with an immutable upstream
  # monorepo tag, which keeps source/license provenance auditable.
  "langchain-community==0.3.22",
  "langchain-core>=0.3.80,<1",
]

[dependency-groups]
build = ["setuptools==84.0.0"]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["nemoguardrails_nemo_relay"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nemoguardrails_nemo_relay*"]

[tool.uv]
# Guardrails AI's stable OpenTelemetry stack requires its matching beta
# semantic-conventions package, so admit pre-releases only when required.
prerelease = "if-necessary"
# Guardrails AI 0.11 requires LangChain Core 1.x, while the provider-native
# The Anthropic adapter covered by NeMo Guardrails 0.24 is on LangChain Core
# 0.3.x. They are separate worker build profiles and cannot share one Python
# environment.
conflicts = [
  [
    { extra = "guardrails-ai" },
    { extra = "langchain-anthropic" },
  ],
  [
    # Cleanlab Studio requires semver 2.x; Guardrails AI requires 3.x.
    { extra = "cleanlab" },
    { extra = "guardrails-ai" },
  ],
]
