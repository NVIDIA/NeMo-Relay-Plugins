schema_version = 1
name = "nemo-guardrails-plugin"
version = "0.1.0"
type = "native"

[metadata]
description = "NVIDIA NeMo Guardrails tool-call checks for NeMo Relay"
license = "Apache-2.0"
authors = ["NVIDIA Corporation"]
repository = "https://github.com/NVIDIA-NeMo/Guardrails"
documentation = "https://github.com/NVIDIA-NeMo/Guardrails/tree/develop/crates/nemo-guardrails-relay-plugin"

[source]
location = "remote"
path = "crates/nemo-guardrails-relay-plugin"
repository = "https://github.com/NVIDIA-NeMo/Guardrails"
ref = "develop"
sha = "537fd774298260261bc4ee15e78d861b9e5814e5"

[toolchains]
python = "3.11"
rust = "1.96.1"

[relay]
tag = "0.11.0"

[commands.build]
argv = ["${PYTHON}", "${PLUGIN_DIR}/tasks.py", "build"]
cwd = "source"

[commands.test]
argv = ["${PYTHON}", "${PLUGIN_DIR}/tasks.py", "test"]
cwd = "source"

[commands.package]
argv = ["${PYTHON}", "${PLUGIN_DIR}/tasks.py", "package"]
cwd = "source"

[commands.smoke]
argv = ["${PYTHON}", "${PLUGIN_DIR}/smoke_test.py"]
cwd = "source"

[artifacts]
bundle = "bundle"
manifest = "relay-plugin.toml"
