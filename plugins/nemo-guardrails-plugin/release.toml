schema_version = 1
name = "nemo-guardrails-plugin"
version = "0.1.0"
type = "worker"
platforms = ["linux-x86_64", "linux-arm64", "windows-x86_64", "macos-arm64"]

[metadata]
description = "NeMo Guardrails text and structural function-tool policy for NeMo Relay"
license = "Apache-2.0"
authors = ["NVIDIA Corporation"]
repository = "https://github.com/NVIDIA/NeMo-Relay-Plugins"
documentation = "https://github.com/NVIDIA/NeMo-Relay-Plugins/tree/main/plugins/nemo-guardrails-plugin"

[source]
location = "in-tree"
path = "."

[toolchains]
python = "3.11"

[commands.build]
argv = ["${PYTHON}", "${PLUGIN_DIR}/tasks.py", "build"]
cwd = "source"

[commands.test]
argv = ["${PYTHON}", "${PLUGIN_DIR}/tasks.py", "test"]
cwd = "source"

[commands.package]
argv = ["${PYTHON}", "${PLUGIN_DIR}/tasks.py", "package"]
cwd = "source"

[commands.smoke]
argv = ["${PYTHON}", "${PLUGIN_DIR}/smoke_test.py"]
cwd = "source"

[artifacts]
bundle = "bundle"
manifest = "relay-plugin.toml"

# Build from the merge that introduced execution codec capabilities. Replace
# this SHA with the Relay 0.10.0 release commit before publishing the plugin.
[relay]
sha = "e20c4fedb0d16b3401dc888725940777c4ce8521"
